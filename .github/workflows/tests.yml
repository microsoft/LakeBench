name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/integration -v --tb=short

  integration-tests:
    name: integration (${{ matrix.engine }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: duckdb
            allow_failure: false
            extras_flags: "--extra duckdb --extra tpcds_datagen --extra tpch_datagen"
            test_file: "tests/integration/test_duckdb.py"
          # Daft is intentionally absent: it cannot read the Arrow `Utf8View` the TPC
          # generators emit, so every TPC and ELTBench load fails. tests/integration/test_daft.py
          # skips unless LAKEBENCH_RUN_DAFT_INTEGRATION=1, so running it here would only
          # install the extra to report skips. Restore this lane once Daft supports Utf8View.
          - engine: polars
            allow_failure: false
            extras_flags: "--extra polars --extra tpcds_datagen --extra tpch_datagen"
            test_file: "tests/integration/test_polars.py"
          - engine: spark
            allow_failure: false
            extras_flags: "--extra spark --extra tpcds_datagen --extra tpch_datagen"
            test_file: "tests/integration/test_spark.py"
            java: "17"
          - engine: sail
            allow_failure: false
            extras_flags: "--extra sail --extra tpcds_datagen --extra tpch_datagen"
            test_file: "tests/integration/test_sail.py"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ matrix.java }}
        if: matrix.java != ''
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies (${{ matrix.engine }})
        run: uv sync --group dev ${{ matrix.extras_flags }}

      - name: Run integration tests (${{ matrix.engine }})
        run: uv run pytest ${{ matrix.test_file }} -v -s --tb=short -W always
