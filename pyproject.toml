[project]
name = "lakebench"
version = "1.2.1"
authors = [
    { name="Miles Cole" },
]
license = {file = "LICENSE"}
description = "A multi-modal Python library for benchmarking Azure lakehouse engines and ELT scenarios, supporting both industry-standard and novel benchmarks."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "numpy>=1.24.4",
    "sqlglot==26.30.0",
    "fsspec==2025.2.0",
    # Keep the floor at 14 so Fabric Runtime 1.3 (pyarrow 14.0.2) and Runtime 2.0
    # (24.0.0) are both already satisfied. Forcing an upgrade inside a running
    # notebook session leaves the old compiled pyarrow.lib loaded and breaks with
    # "cannot import name 'is_threading_enabled' from 'pyarrow.lib'".
    "pyarrow>=14.0.0",
    "tenacity>=8.2.3,<9; python_version < '3.9'",
    "tenacity==9.1.2; python_version >= '3.9'"
]

[project.optional-dependencies]
# The core `pyarrow>=14.0.0` floor is deliberately low (see above); extras that
# write via delta-rs need a newer pyarrow and state it explicitly here.
duckdb = ["duckdb==1.5.5; python_version >= '3.10'", "deltalake==1.6.2; python_version >= '3.10'", "pyarrow>=16.0.0; python_version >= '3.10'"]
polars = ["polars==1.43.2; python_version >= '3.10'", "deltalake==1.6.2; python_version >= '3.10'", "pyarrow>=16.0.0; python_version >= '3.10'"]
# Daft is held on deltalake 1.5.x: 1.6.x emits DataFusion `string_view` parquet
# from MERGE, and Daft's reader rejects Arrow Utf8View.
daft = ["daft[deltalake]==0.7.21; python_version >= '3.10'", "deltalake>=1.5.0,<1.6.0; python_version >= '3.10'", "pyarrow>=16.0.0; python_version >= '3.10'"]
tpcds_datagen = ["duckdb==1.5.5; python_version >= '3.10'"]
tpch_datagen = ["tpchgen-cli>=3.0.0"]
sparkmeasure = ["sparkmeasure==0.28.0; python_version >= '3.9'"]
spark = ["pyspark>=3.5.0,<4.0.0; python_version >= '3.9'", "delta-spark>=3.2.0,<4.0.0; python_version >= '3.9'"]
# pysail is a floor rather than the newest release: it is a lower bound only, so
# the resolver picks the newest version available in whichever index is
# configured, and internal mirrors can lag several days behind PyPI.
sail = ["pysail>=0.6.6; python_version >= '3.10'", "pyspark[connect]>=4.0.0; python_version >= '3.10'", "deltalake>=1.6.2; python_version >= '3.10'", "pyarrow>=16.0.0; python_version >= '3.10'"]

[project.urls]
github = "https://github.com/mwc360/LakeBench"
Issues = "https://github.com/mwc360/LakeBench/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakebench"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "metastore_db",
    "src/lakebench/benchmarks/*/resources",
]

[tool.ruff.lint]
# Conservative starter set — formatting + obvious bugs only.
# Expand later (UP, B, SIM, ANN) once the codebase is clean.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line-too-long (line-length is advisory; many SQL strings are wide)
    "E731",  # lambda assignments (used intentionally in a few places)
    "E741",  # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"tests/**" = ["F401", "F811", "F841", "E712"]  # fixtures + assertion patterns
"scripts/**" = ["E402", "F401", "F841"]  # ad-hoc scripts
# Trailing whitespace inside multi-line SQL string literals is intentional/
# harmless and NOT touched by `ruff format` (it only formats code, not string
# contents). Keep ignoring W291/W293 globally so the embedded-SQL engines pass.
"*.py" = ["W291", "W293"]
# Engine-specific DataFrame DSLs intentionally use `col == True` to build expressions,
# and assign `result =`/`df =` to force lazy evaluation.
"src/lakebench/benchmarks/tpcdi/engine_impl/*.py" = ["E712", "F841"]
"src/lakebench/benchmarks/elt_bench/engine_impl/*.py" = ["F841"]
"src/lakebench/engines/*.py" = ["F841"]

[tool.uv]
conflicts = [
    [{ extra = "spark" }, { extra = "sail" }],
    # daft holds deltalake at 1.5.x; the other Delta engines are on 1.6.x.
    [{ extra = "daft" }, { extra = "duckdb" }],
    [{ extra = "daft" }, { extra = "polars" }],
    [{ extra = "daft" }, { extra = "sail" }],
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that generate data and run full benchmarks (require optional extras)",
]
